<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verbum" />
    <meta name="application-name" content="Verbum" />

    <!-- Theme -->
    <meta name="theme-color" content="#d4af37" />
    <meta name="msapplication-TileColor" content="#050504" />

    <!-- SEO & Social -->
    <meta name="description" content="Verbum — AI-powered captions for every language and accent with Catholic dignity and precision." />
    <meta property="og:title" content="Verbum — AI Caption Software" />
    <meta property="og:description" content="AI-powered captions for every language, every accent — with maximum precision." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Verbum — AI Caption Software</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
