version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./uploads:/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/uploads
      - JWT_SECRET=${JWT_SECRET:-SACRED_HEART_OF_JESUS_AUTHENTICATION_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET:-1234}
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker.celery worker --loglevel=info
    volumes:
      - ./uploads:/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/uploads
      - WHISPER_MODEL=base
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
